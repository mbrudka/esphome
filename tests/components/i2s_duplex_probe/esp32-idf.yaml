esphome:
  name: i2s-duplex-probe

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf

logger:

i2s_audio:
  id: codec_bus
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO5
  i2s_mclk_pin: GPIO0

i2s_duplex_probe:
  id: duplex_probe
  i2s_audio_id: codec_bus
  i2s_din_pin: GPIO35
  i2s_dout_pin: GPIO26

button:
  - platform: template
    name: Run duplex test
    on_press:
      - lambda: id(duplex_probe).start_test();
